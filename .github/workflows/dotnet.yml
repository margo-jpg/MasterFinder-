name: .NET Tests

on:
  push:
    branches: [ "DomainLayer", "main" ]
  pull_request:
    branches: [ "DomainLayer", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore MasterFinder1.sln
    - name: Build
      run: dotnet build MasterFinder1.sln --no-restore
    - name: Test
      run: dotnet test MasterFinder.Domain.Tests/MasterFinder.Domain.Tests.csproj --no-build --verbosity normal
